name: E2E Tests

# Runs the Playwright smoke tests against production after each successful
# Vercel production deploy, and on demand.
on:
  deployment_status:
  workflow_dispatch:

jobs:
  e2e:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Install Playwright browser
      run: npx playwright install --with-deps chromium

    - name: Run E2E tests
      run: npm test
      env:
        BASE_URL: https://analytica-phi.vercel.app

    - name: Upload traces on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-traces
        path: test-results/
        retention-days: 7
